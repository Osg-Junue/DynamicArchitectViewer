name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Verify extension and webview bundles exist
        run: |
          test -f apps/vscode/dist/extension.cjs
          test -f apps/vscode/dist/webview/assets/webview.js
          test -f apps/vscode/dist/webview/assets/webview.css
