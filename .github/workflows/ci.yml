name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - name: Verify extension, webview, skill, and VSIX package exist
        run: |
          test -f apps/vscode/dist/extension.cjs
          test -f apps/vscode/dist/webview/assets/webview.js
          test -f apps/vscode/dist/webview/assets/webview.css
          test -f apps/vscode/dist/skill/dav-diagrams/SKILL.md
          test -f apps/vscode/dist/dynamic-architect-viewer.vsix
          test -f apps/cli/dist/dav.mjs
      - name: Verify the generated skill files are committed
        run: git diff --exit-code -- skills
      - uses: actions/upload-artifact@v7
        with:
          name: dynamic-architect-viewer-vsix
          path: apps/vscode/dist/dynamic-architect-viewer.vsix
