name: Playground

# Publishes the playground to GitHub Pages when a release is tagged, so that it behaves as the
# published extension does. Run it by hand to publish the current main.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# One deployment at a time; a running one finishes rather than leaving the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm --workspace=apps/vscode run build:playground
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/vscode/dist/playground

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
