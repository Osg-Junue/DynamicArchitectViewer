<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The page loads nothing from elsewhere. Monaco styles its lines inline, and the search for
      the zones runs in a worker started from a blob, as in the webview of the extension.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Write a .dav diagram and watch it play step by step, in the browser."
    />
    <title>DynamicArchitectViewer Playground</title>
  </head>
  <body>
    <div id="playground"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
